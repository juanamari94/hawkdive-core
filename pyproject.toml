[project]
name = "hawkdive-core"
version = "0.1.0"
description = "A local proof of concept for production alert investigation."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.1.4,<3",
    "alembic>=1.20.0,<2",
    "aiosqlite>=0.22.1,<1",
    "langgraph>=1.2.15,<2",
    "langchain[mcp]>=1.4.6,<2",
    "langchain-openrouter>=0.2.9,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLC0415", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20"]
