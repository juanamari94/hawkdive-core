[project]
name = "hawkdive-core"
version = "0.1.0"
description = "A local proof of concept for production alert investigation."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.1.4,<3",
    "alembic>=1.20.0,<2",
    "aiosqlite>=0.22.1,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
