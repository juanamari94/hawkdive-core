apiVersion: 1

groups:
  - orgId: 1
    name: local-verification
    folder: Hawkdive verification
    interval: 10s
    rules:
      - uid: hawkdive-local-verification
        title: Hawkdive local delivery verification
        condition: A
        data:
          - refId: A
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: '1 == 0'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              type: math
        noDataState: NoData
        execErrState: Error
        for: 0s
        keepFiringFor: 0s
        annotations:
          summary: Controlled local webhook delivery verification
        labels:
          hawkdive_verification: 'true'
          service: local-verification
          environment: local

policies:
  - orgId: 1
    receiver: empty
    group_by: [grafana_folder, alertname]
    routes:
      - receiver: hawkdive-local
        object_matchers:
          - [hawkdive_verification, '=', 'true']
        group_wait: 1s
        group_interval: 10s
        repeat_interval: 1h
